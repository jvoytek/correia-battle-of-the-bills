<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle of the Bills</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="leaderboard-frame" aria-label="Battle of the Bills fundraiser leaderboard">

      <!-- Score cards and lead differential update directly from leaderboard.json. -->
      <section class="scoreboard" aria-label="Team standings">
        <article id="seventh-grade-team-card" data-team-card="7th Grade">
          <p class="team-total" data-total-for="7th Grade">0</p>
        </article>

        <article id="eighth-grade-team-card" data-team-card="8th Grade">
          <p class="team-total" data-total-for="8th Grade">0</p>
        </article>

      </section>

      <!-- The chart canvas stays transparent so the background image remains visible below it. -->
      <section class="chart-panel" aria-label="Progress chart">
        <div class="chart-surface">
          <p id="day-number" aria-live="off">Day 0</p>
          <table id="progress-chart">
            <thead>
              <tr>
                <th scope="col"></th>
                <th scope="col">7th</th>
                <th scope="col">8th</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Online Points</td>
                <td id="online-7th">0</td>
                <td id="online-8th">0</td>
              </tr>
              <tr>
                <td>Pennies</td>
                <td id="pennies-7th">0</td>
                <td id="pennies-8th">0</td>
              </tr>
              <tr>
                <td>Bonus Points</td>
                <td id="bonus-7th">0</td>
                <td id="bonus-8th">0</td>
              </tr>
              <tr>
                <td>Sabotage</td>
                <td id="sabotage-7th">0</td>
                <td id="sabotage-8th">0</td>
              </tr>
              <tr>
                <td>Total</td>
                <td id="total-7th">0</td>
                <td id="total-8th">0</td>
              </tr>
            </tbody>
          </table>

          <div style="text-align:center; margin-top:2rem">
            Total Raised<br />
          <span id="school-total">$0.00</span>
          </div>
        </div>
        <p class="visually-hidden" id="chart-summary">
          Loading cumulative daily progress for 7th Grade and 8th Grade.
        </p>
      </section>

      <aside class="online-leaderboard" aria-label="Top online student contributors">
        <ol id="student-leaderboard"></ol>
      </aside>

      <footer class="status-ticker" aria-live="polite">
        <span>Last Updated:</span>
        <strong id="last-updated">Loading…</strong>
      </footer>
    </section>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
